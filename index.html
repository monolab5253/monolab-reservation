<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究室 備品予約システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f3f4f6; }
    .fc-header-toolbar { font-size: 0.85rem; }
  </style>
</head>
<body class="text-gray-800">

  <!-- ヘッダー -->
  <header class="bg-emerald-800 text-white px-6 py-3 flex justify-between items-center shadow-md">
    <h1 class="text-xl font-bold tracking-wide">研究室 備品予約システム</h1>
    <div class="flex items-center space-x-4">
      <div id="userInfo" class="text-sm"></div>
      <button id="btnAdminMenu" onclick="openAdminModal()" class="hidden bg-amber-500 hover:bg-amber-600 text-white text-xs px-3 py-1.5 rounded font-bold transition">
        ⚙️ 管理者メニュー
      </button>
    </div>
  </header>

  <!-- 1. メールアドレス入力モーダル -->
  <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl w-96">
      <h2 class="text-lg font-bold mb-2 text-emerald-800">サインイン</h2>
      <p class="text-xs text-gray-600 mb-4">メールアドレスを入力してログインしてください。（未登録の場合は初期登録へ進みます）</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-xs font-semibold mb-1">メールアドレス</label>
          <input type="email" id="loginEmail" required class="w-full border rounded px-3 py-2 text-sm focus:outline-emerald-600" placeholder="student@example.com">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-emerald-700 text-white py-2 rounded hover:bg-emerald-800 font-semibold text-sm">次へ</button>
      </form>
    </div>
  </div>

  <!-- 2. 初回登録モーダル（未登録アドレスの場合） -->
  <div id="registerModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl w-96">
      <h2 class="text-lg font-bold mb-2 text-emerald-800">初期ユーザー登録</h2>
      <p class="text-xs text-gray-600 mb-4">アカウントが見つかりません。氏名と所属を入力してください。</p>
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label class="block text-xs font-semibold mb-1">氏名</label>
          <input type="text" id="regName" required class="w-full border rounded px-3 py-2 text-sm focus:outline-emerald-600" placeholder="山田 太郎">
        </div>
        <div class="mb-4">
          <label class="block text-xs font-semibold mb-1">所属</label>
          <input type="text" id="regDept" required class="w-full border rounded px-3 py-2 text-sm focus:outline-emerald-600" placeholder="例: モノづくりラボ">
        </div>
        <button type="submit" id="btnRegister" class="w-full bg-emerald-700 text-white py-2 rounded hover:bg-emerald-800 font-semibold text-sm">登録して始める</button>
      </form>
    </div>
  </div>

  <!-- 3. 管理者専用モーダル -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl w-[750px] max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2 mb-4">
        <h2 class="text-lg font-bold text-amber-800">⚙️ 管理者ダッシュボード</h2>
        <button onclick="closeAdminModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <!-- タブ切り替え -->
      <div class="flex border-b mb-4 text-sm">
        <button onclick="switchAdminTab('equip')" id="tabEquipBtn" class="px-4 py-2 border-b-2 border-amber-600 font-bold text-amber-800">備品管理</button>
        <button onclick="switchAdminTab('users')" id="tabUsersBtn" class="px-4 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700">ユーザー・講習管理</button>
      </div>

      <!-- 備品管理パネル -->
      <div id="adminEquipPanel">
        <form onsubmit="handleSaveEquipment(event)" class="bg-gray-50 p-3 rounded mb-4 text-xs border">
          <div class="font-bold mb-2 text-gray-700" id="equipFormTitle">➕ 備品の新規追加</div>
          <input type="hidden" id="editEquipId">
          <div class="grid grid-cols-2 gap-2 mb-2">
            <div>
              <label class="block mb-1 font-semibold">備品ID (例: EQ_02)</label>
              <input type="text" id="eqId" required class="w-full border rounded p-1">
            </div>
            <div>
              <label class="block mb-1 font-semibold">備品名</label>
              <input type="text" id="eqName" required class="w-full border rounded p-1">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2 mb-2">
            <div>
              <label class="block mb-1 font-semibold">設置場所</label>
              <input type="text" id="eqLocation" class="w-full border rounded p-1">
            </div>
            <div>
              <label class="block mb-1 font-semibold">必要講習名 (なしの場合は空欄)</label>
              <input type="text" id="eqTraining" class="w-full border rounded p-1">
            </div>
            <div>
              <label class="block mb-1 font-semibold">ステータス</label>
              <select id="eqStatus" class="w-full border rounded p-1">
                <option value="利用可能">利用可能</option>
                <option value="利用不可">利用不可</option>
              </select>
            </div>
          </div>
          <div class="flex space-x-2">
            <button type="submit" class="bg-amber-600 text-white px-3 py-1 rounded font-bold hover:bg-amber-700">保存</button>
            <button type="button" onclick="resetEquipForm()" class="bg-gray-300 text-gray-700 px-3 py-1 rounded hover:bg-gray-400">キャンセル</button>
          </div>
        </form>

        <div id="adminEquipList" class="space-y-2 text-xs"></div>
      </div>

      <!-- ユーザー・講習管理パネル -->
      <div id="adminUsersPanel" class="hidden">
        <div id="adminUsersList" class="space-y-3 text-xs"></div>
      </div>
    </div>
  </div>

  <!-- メイン画面 -->
  <main class="max-w-7xl mx-auto p-4">
    <div class="grid grid-cols-4 gap-4 mb-4">
      <div class="bg-white p-4 rounded shadow border-t-4 border-emerald-600 text-center">
        <div class="text-2xl font-bold" id="statEquip">0</div>
        <div class="text-xs text-gray-500">備品総数</div>
      </div>
      <div class="bg-white p-4 rounded shadow border-t-4 border-red-500 text-center">
        <div class="text-2xl font-bold text-red-600" id="statDisabled">0</div>
        <div class="text-xs text-gray-500">利用不可の備品</div>
      </div>
      <div class="bg-white p-4 rounded shadow border-t-4 border-blue-500 text-center">
        <div class="text-2xl font-bold text-blue-600" id="statBookings">0</div>
        <div class="text-xs text-gray-500">有効予約数</div>
      </div>
      <div class="bg-white p-4 rounded shadow border-t-4 border-amber-500 text-center">
        <div class="text-2xl font-bold" id="statUsers">0</div>
        <div class="text-xs text-gray-500">登録ユーザー数</div>
      </div>
    </div>

    <div class="grid grid-cols-12 gap-6">
      <div class="col-span-4 space-y-6">
        <!-- 新規予約フォーム -->
        <div class="bg-white p-4 rounded shadow">
          <h2 class="text-sm font-bold border-b pb-2 mb-3 text-gray-700 flex items-center">
            <span class="mr-1">📅</span> 新規予約
          </h2>
          <form id="bookingForm" onsubmit="handleBooking(event)">
            <div class="mb-3">
              <label class="block text-xs font-semibold mb-1">備品</label>
              <select id="equipSelect" onchange="updateEquipInfo()" class="w-full border rounded px-2 py-1.5 text-sm"></select>
              <div id="equipDetail" class="mt-2 text-xs bg-gray-50 p-2 rounded text-gray-600 space-y-0.5">
                <div>設置場所: <span id="infoLocation">-</span></div>
                <div>必要講習: <span id="infoTraining" class="font-semibold text-emerald-700">-</span></div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-3">
              <div>
                <label class="block text-xs font-semibold mb-1">開始日時</label>
                <input type="datetime-local" id="startTime" required class="w-full border rounded px-2 py-1 text-xs">
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">終了日時</label>
                <input type="datetime-local" id="endTime" required class="w-full border rounded px-2 py-1 text-xs">
              </div>
            </div>

            <div class="mb-4">
              <label class="block text-xs font-semibold mb-1">利用目的</label>
              <textarea id="purpose" rows="2" placeholder="例）○○実験のため" required class="w-full border rounded px-2 py-1 text-xs"></textarea>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-emerald-700 text-white py-2 rounded hover:bg-emerald-800 font-semibold text-xs transition">
              ✓ 予約する
            </button>
          </form>
        </div>

        <!-- 予約一覧 -->
        <div class="bg-white p-4 rounded shadow">
          <div class="flex justify-between items-center border-b pb-2 mb-3">
            <h2 class="text-sm font-bold text-gray-700">📑 予約一覧</h2>
            <div class="inline-flex rounded-md shadow-sm text-xs">
              <button onclick="filterLogs('my')" id="btnFilterMy" class="px-2 py-1 bg-gray-700 text-white rounded-l">自分の予約</button>
              <button onclick="filterLogs('all')" id="btnFilterAll" class="px-2 py-1 bg-gray-200 text-gray-700 rounded-r">すべて</button>
            </div>
          </div>
          <div id="logList" class="space-y-2 max-h-80 overflow-y-auto text-xs"></div>
        </div>
      </div>

      <!-- 右側: カレンダー -->
      <div class="col-span-8 bg-white p-4 rounded shadow">
        <div id="calendar"></div>
      </div>
    </div>
  </main>

  <script>
    // ▼▼▼ ご自身の Supabase / GAS 情報に書き換えてください ▼▼▼
    const SUPABASE_URL = 'https://venzrdwpkfmijiqocaee.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OQhRrKbi37Sn3STe7rS2yQ_3uMkMYQn';
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbx6bvACX-MWe8NY5lPHXk5KZyre8U57jZwsEV9hP-KJ-F0vzlVbeL-S6YlponQFNWpmJw/exec';
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let AppState = { currentUser: null, tempEmail: '', equipments: [], logs: [], users: [], calendar: null, filterMode: 'my' };

    window.onload = function() {
      initCalendar();
    };

    // ログイン処理
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      if (!email) return;

      document.getElementById('btnLogin').disabled = true;

      const { data: user, error } = await supabaseClient.from('users').select('*').eq('email', email).maybeSingle();
      document.getElementById('btnLogin').disabled = false;

      if (error) {
        alert('接続エラー: ' + error.message);
        return;
      }

      if (user) {
        AppState.currentUser = user;
        document.getElementById('loginModal').classList.add('hidden');
        await loadData();
      } else {
        AppState.tempEmail = email;
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('registerModal').classList.remove('hidden');
      }
    }

    // 初回ユーザー登録処理 (デフォルト: USERS / 講習未記入)
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const dept = document.getElementById('regDept').value.trim();

      document.getElementById('btnRegister').disabled = true;

      const newUserObj = { 
        email: AppState.tempEmail, 
        name: name, 
        dept: dept, 
        role: 'USERS', 
        trainings: '' 
      };

      const { data: newUser, error } = await supabaseClient.from('users').insert([newUserObj]).select().single();

      document.getElementById('btnRegister').disabled = false;

      if (error) {
        alert('登録に失敗しました: ' + error.message);
        return;
      }

      AppState.currentUser = newUser;
      document.getElementById('registerModal').classList.add('hidden');
      await loadData();
    }

    // データ読み込み
    async function loadData() {
      const [eqRes, logRes, userRes] = await Promise.all([
        supabaseClient.from('equipments').select('*'),
        supabaseClient.from('logs').select('*'),
        supabaseClient.from('users').select('*')
      ]);

      AppState.equipments = eqRes.data || [];
      AppState.logs = logRes.data || [];
      AppState.users = userRes.data || [];

      renderUI();
    }

function initCalendar() {
  const calendarEl = document.getElementById('calendar');
  AppState.calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'timeGridWeek', // 初期表示を「週表示(時間軸あり)」に設定
    locale: 'ja',
    headerToolbar: { 
      left: 'prev,next today', 
      center: 'title', 
      right: 'dayGridMonth,timeGridWeek,timeGridDay' 
    },
    // ボタンのテキストをわかりやすい日本語に変更
    buttonText: {
      today: '今日',
      month: '月',
      week: '週',
      day: '日'
    },
    slotMinTime: '08:00:00',
    slotMaxTime: '20:00:00',
    allDaySlot: false,
    height: 'auto'
  });
  AppState.calendar.render();
}
    function renderUI() {
      const u = AppState.currentUser;
      document.getElementById('userInfo').innerText = `${u.name} (${u.dept}) / ${u.role}`;

      if (u.role === 'ADMIN') {
        document.getElementById('btnAdminMenu').classList.remove('hidden');
      }

      document.getElementById('statEquip').innerText = AppState.equipments.length;
      document.getElementById('statDisabled').innerText = AppState.equipments.filter(e => e.status !== '利用可能').length;
      document.getElementById('statBookings').innerText = AppState.logs.length;
      document.getElementById('statUsers').innerText = AppState.users.length;

      const equipSelect = document.getElementById('equipSelect');
      equipSelect.innerHTML = AppState.equipments.map(e => `<option value="${e.id}">${e.name} (${e.location || '未設定'})</option>`).join('');
      updateEquipInfo();

      renderLogs();
      updateCalendarEvents();
      renderAdminEquipList();
      renderAdminUsersList();
    }

    function updateEquipInfo() {
      const selectedId = document.getElementById('equipSelect').value;
      const equip = AppState.equipments.find(e => e.id === selectedId);
      if (equip) {
        document.getElementById('infoLocation').innerText = equip.location || '未設定';
        document.getElementById('infoTraining').innerText = equip.required_training || 'なし';
      }
    }

    // 予約申請
    async function handleBooking(e) {
      e.preventDefault();
      const u = AppState.currentUser;
      const equipId = document.getElementById('equipSelect').value;
      const equip = AppState.equipments.find(e => e.id === equipId);

      // 【講習未受講の判定】(USERS ロールのみチェック)
      if (u.role === 'USERS' && equip.required_training && equip.required_training !== 'なし' && equip.required_training.trim() !== '') {
        const userTrainings = u.trainings ? u.trainings.split(',').map(t => t.trim()) : [];
        if (!userTrainings.includes(equip.required_training.trim())) {
          alert(`【予約エラー】\nこの備品の利用には「${equip.required_training}」の受講が必要です。\n管理者に受講完了の権限付与を依頼してください。`);
          return;
        }
      }

      const logId = 'LOG_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;
      const purpose = document.getElementById('purpose').value;

      const bookingData = {
        id: logId,
        equip_id: equip.id,
        equip_name: equip.name,
        user_email: u.email,
        start_time: startTime,
        end_time: endTime,
        purpose: purpose
      };

      document.getElementById('btnSubmit').disabled = true;
      const { error } = await supabaseClient.from('logs').insert([bookingData]);
      document.getElementById('btnSubmit').disabled = false;

      if (error) {
        alert('予約エラー: ' + error.message);
      } else {
        // Googleカレンダーへ追加リクエスト（GAS経由）
        syncToGoogleCalendar('create', {
          id: logId,
          title: `${equip.name} (${u.name})`,
          startTime: startTime,
          endTime: endTime,
          description: `利用目的: ${purpose}\n予約者: ${u.name} (${u.email})`
        });

        alert('予約が完了しました！');
        await loadData();
      }
    }

    function renderLogs() {
      const logList = document.getElementById('logList');
      const filtered = AppState.logs.filter(l => AppState.filterMode === 'my' ? l.user_email === AppState.currentUser.email : true);

      if (filtered.length === 0) {
        logList.innerHTML = `<div class="text-center text-gray-400 py-4">予約はありません</div>`;
        return;
      }

      logList.innerHTML = filtered.map(l => {
        const canDelete = l.user_email === AppState.currentUser.email || AppState.currentUser.role === 'ADMIN';
        const startTimeStr = l.start_time ? l.start_time.replace('T', ' ').substring(0, 16) : '';
        const endTimeStr = l.end_time ? l.end_time.replace('T', ' ').substring(0, 16) : '';

        return `
          <div class="border rounded p-2 bg-gray-50 flex justify-between items-center">
            <div>
              <div class="font-bold text-gray-800">${l.equip_name || '備品'}</div>
              <div class="text-gray-500">${startTimeStr} ～ ${endTimeStr}</div>
              <div class="text-gray-400">${l.purpose || ''} (${l.user_email})</div>
            </div>
            ${canDelete ? `<button onclick="handleCancel('${l.id}')" class="text-red-600 border border-red-300 rounded px-2 py-0.5 hover:bg-red-50">削除</button>` : ''}
          </div>
        `;
      }).join('');
    }

    // 予約取消
    async function handleCancel(logId) {
      if (!confirm('予約を取り消しますか？')) return;
      const { error } = await supabaseClient.from('logs').delete().eq('id', logId);
      if (error) {
        alert('削除エラー: ' + error.message);
      } else {
        // Googleカレンダーから削除リクエスト（GAS経由）
        syncToGoogleCalendar('delete', { id: logId });
        await loadData();
      }
    }

    function updateCalendarEvents() {
      AppState.calendar.removeAllEvents();
      const events = AppState.logs.map(l => {
        const userObj = AppState.users.find(u => u.email === l.user_email);
        const userName = userObj ? userObj.name : l.user_email;

        return {
          id: l.id,
          title: `${l.equip_name || '備品'} (${userName})`,
          start: l.start_time,
          end: l.end_time,
          backgroundColor: l.user_email === AppState.currentUser.email ? '#047857' : '#4b5563'
        };
      });
      AppState.calendar.addEventSource(events);
    }

    function filterLogs(mode) {
      AppState.filterMode = mode;
      document.getElementById('btnFilterMy').className = mode === 'my' ? 'px-2 py-1 bg-gray-700 text-white rounded-l' : 'px-2 py-1 bg-gray-200 text-gray-700 rounded-l';
      document.getElementById('btnFilterAll').className = mode === 'all' ? 'px-2 py-1 bg-gray-700 text-white rounded-r' : 'px-2 py-1 bg-gray-200 text-gray-700 rounded-r';
      renderLogs();
    }

    // --- 管理者専用機能 ---
    function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); }
    function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

    function switchAdminTab(tab) {
      if (tab === 'equip') {
        document.getElementById('adminEquipPanel').classList.remove('hidden');
        document.getElementById('adminUsersPanel').classList.add('hidden');
        document.getElementById('tabEquipBtn').className = "px-4 py-2 border-b-2 border-amber-600 font-bold text-amber-800";
        document.getElementById('tabUsersBtn').className = "px-4 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700";
      } else {
        document.getElementById('adminEquipPanel').classList.add('hidden');
        document.getElementById('adminUsersPanel').classList.remove('hidden');
        document.getElementById('tabEquipBtn').className = "px-4 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700";
        document.getElementById('tabUsersBtn').className = "px-4 py-2 border-b-2 border-amber-600 font-bold text-amber-800";
      }
    }

    function renderAdminEquipList() {
      const container = document.getElementById('adminEquipList');
      container.innerHTML = AppState.equipments.map(e => `
        <div class="border rounded p-2 flex justify-between items-center bg-white">
          <div>
            <span class="font-bold text-gray-800">[${e.id}] ${e.name}</span>
            <span class="text-gray-500 ml-2">(${e.location || '場所未設定'})</span>
            <div class="text-gray-400">必要講習: ${e.required_training || 'なし'} / 状態: ${e.status}</div>
          </div>
          <button onclick="editEquipment('${e.id}')" class="text-blue-600 border border-blue-300 rounded px-2 py-0.5">編集</button>
        </div>
      `).join('');
    }

    function editEquipment(id) {
      const eq = AppState.equipments.find(e => e.id === id);
      if (!eq) return;
      document.getElementById('editEquipId').value = eq.id;
      document.getElementById('eqId').value = eq.id;
      document.getElementById('eqId').disabled = true;
      document.getElementById('eqName').value = eq.name;
      document.getElementById('eqLocation').value = eq.location || '';
      document.getElementById('eqTraining').value = eq.required_training || '';
      document.getElementById('eqStatus').value = eq.status || '利用可能';
      document.getElementById('equipFormTitle').innerText = '✏️ 備品の編集';
    }

    function resetEquipForm() {
      document.getElementById('editEquipId').value = '';
      document.getElementById('eqId').value = '';
      document.getElementById('eqId').disabled = false;
      document.getElementById('eqName').value = '';
      document.getElementById('eqLocation').value = '';
      document.getElementById('eqTraining').value = '';
      document.getElementById('eqStatus').value = '利用可能';
      document.getElementById('equipFormTitle').innerText = '➕ 備品の新規追加';
    }

    async function handleSaveEquipment(e) {
      e.preventDefault();
      const isEdit = !!document.getElementById('editEquipId').value;
      const eqData = {
        id: document.getElementById('eqId').value.trim(),
        name: document.getElementById('eqName').value.trim(),
        location: document.getElementById('eqLocation').value.trim(),
        required_training: document.getElementById('eqTraining').value.trim() || 'なし',
        status: document.getElementById('eqStatus').value
      };

      const { error } = isEdit 
        ? await supabaseClient.from('equipments').update(eqData).eq('id', eqData.id)
        : await supabaseClient.from('equipments').insert([eqData]);

      if (error) {
        alert('保存エラー: ' + error.message);
      } else {
        alert('備品情報を保存しました');
        resetEquipForm();
        await loadData();
      }
    }

    // ユーザー一覧・講習管理の描画 (備品から必要講習を自動抽出して複数選択チェックボックス表示)
    function renderAdminUsersList() {
      const container = document.getElementById('adminUsersList');

      // 備品データから重複のない必要講習リストを自動抽出 ('なし' や空文字を除外)
      const availableTrainings = [...new Set(
        AppState.equipments
          .map(e => e.required_training ? e.required_training.trim() : '')
          .filter(t => t !== '' && t !== 'なし')
      )];

      container.innerHTML = AppState.users.map(u => {
        const userTrainings = u.trainings ? u.trainings.split(',').map(t => t.trim()) : [];
        const escapedEmail = u.email.replace(/[@.]/g, '_');

        const checkboxesHtml = availableTrainings.length > 0
          ? availableTrainings.map(t => {
              const isChecked = userTrainings.includes(t) ? 'checked' : '';
              return `
                <label class="inline-flex items-center space-x-1 bg-gray-100 px-2 py-1 rounded border text-xs cursor-pointer hover:bg-gray-200">
                  <input type="checkbox" name="train_${escapedEmail}" value="${t}" ${isChecked} class="rounded text-emerald-600 focus:ring-emerald-500">
                  <span>${t}</span>
                </label>
              `;
            }).join(' ')
          : '<span class="text-gray-400">（備品に登録されている必要講習がありません）</span>';

        return `
          <div class="border rounded p-3 bg-white space-y-2">
            <div class="flex justify-between items-center border-b pb-1">
              <span class="font-bold text-gray-800">${u.name} (${u.dept || '所属なし'})</span>
              <span class="text-gray-500">${u.email}</span>
            </div>
            <div class="grid grid-cols-12 gap-2 items-start">
              <div class="col-span-3">
                <label class="block font-semibold mb-1">ロール:</label>
                <select onchange="updateUserRole('${u.email}', this.value)" class="border rounded px-2 py-1 text-xs w-full">
                  <option value="USERS" ${u.role === 'USERS' ? 'selected' : ''}>USERS</option>
                  <option value="ADMIN" ${u.role === 'ADMIN' ? 'selected' : ''}>ADMIN</option>
                </select>
              </div>
              <div class="col-span-9">
                <label class="block font-semibold mb-1">受講済み講習 (複数選択可):</label>
                <div class="flex flex-wrap gap-1.5 mb-2">
                  ${checkboxesHtml}
                </div>
                <button onclick="updateUserTrainings('${u.email}')" class="bg-emerald-700 text-white px-3 py-1 rounded font-bold hover:bg-emerald-800 text-xs">
                  講習設定を保存
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateUserRole(email, newRole) {
      const { error } = await supabaseClient.from('users').update({ role: newRole }).eq('email', email);
      if (error) alert('ロール更新エラー: ' + error.message);
      else await loadData();
    }

    // チェックボックスの選択状態を取得してDB更新
    async function updateUserTrainings(email) {
      const escapedEmail = email.replace(/[@.]/g, '_');
      const checkboxes = document.querySelectorAll(`input[name="train_${escapedEmail}"]:checked`);
      
      const selectedTrainings = Array.from(checkboxes).map(cb => cb.value).join(',');

      const { error } = await supabaseClient.from('users').update({ trainings: selectedTrainings }).eq('email', email);
      
      if (error) {
        alert('講習更新エラー: ' + error.message);
      } else {
        alert('受講済み講習を更新しました！');
        await loadData();
      }
    }

    // --- Googleカレンダー同期通信 (GAS連携) ---
    function syncToGoogleCalendar(action, data) {
      if (!GAS_WEBAPP_URL || GAS_WEBAPP_URL.includes('YOUR_GAS_WEBAPP_URL')) return;

      fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: action, data: data })
      }).catch(err => console.error('GAS Sync Error:', err));
    }
  </script>
</body>
</html>
