<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>研究室 備品予約システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <!-- Google API (Calendar連動用) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <header class="bg-emerald-800 text-white px-6 py-3 flex justify-between items-center shadow">
    <h1 class="text-xl font-bold">研究室 備品予約システム</h1>
    <div id="userInfo" class="text-sm"></div>
  </header>

  <!-- サインインモーダル -->
  <div id="authModal" class="fixed inset-0 bg-black/50 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl w-96 text-center">
      <h2 class="text-lg font-bold mb-4 text-emerald-800">サインイン</h2>
      <button onclick="handleGoogleAuth()" class="w-full bg-emerald-700 text-white py-2 rounded font-bold text-sm hover:bg-emerald-800">
        Googleアカウントでログイン
      </button>
    </div>
  </div>

  <!-- 初回ユーザー情報入力モーダル -->
  <div id="registerModal" class="hidden fixed inset-0 bg-black/50 flex justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl w-96">
      <h2 class="text-lg font-bold mb-4 text-emerald-800">ユーザー初期登録</h2>
      <form onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label class="block text-xs font-bold mb-1">氏名</label>
          <input type="text" id="regName" required class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div class="mb-4">
          <label class="block text-xs font-bold mb-1">所属</label>
          <input type="text" id="regDept" required placeholder="例: ○○研究室" class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <button type="submit" class="w-full bg-emerald-700 text-white py-2 rounded font-bold text-sm">登録完了</button>
      </form>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <main class="max-w-7xl mx-auto p-4 hidden" id="mainApp">
    <!-- ダッシュボード -->
    <div class="grid grid-cols-4 gap-4 mb-4">
      <div class="bg-white p-4 rounded shadow border-t-4 border-emerald-600 text-center">
        <div class="text-2xl font-bold" id="statEquip">0</div>
        <div class="text-xs text-gray-500">備品総数</div>
      </div>
      <div class="bg-white p-4 rounded shadow border-t-4 border-red-500 text-center">
        <div class="text-2xl font-bold text-red-600" id="statDisabled">0</div>
        <div class="text-xs text-gray-500">利用不可の備品</div>
      </div>
      <div class="bg-white p-4 rounded shadow border-t-4 border-blue-500 text-center">
        <div class="text-2xl font-bold text-blue-600" id="statBookings">0</div>
        <div class="text-xs text-gray-500">有効予約数</div>
      </div>
      <div class="bg-white p-4 rounded shadow border-t-4 border-amber-500 text-center">
        <div class="text-2xl font-bold" id="statUsers">0</div>
        <div class="text-xs text-gray-500">登録ユーザー数</div>
      </div>
    </div>

    <div class="grid grid-cols-12 gap-6">
      <!-- 予約フォーム ＆ リスト -->
      <div class="col-span-4 space-y-6">
        <div class="bg-white p-4 rounded shadow">
          <h2 class="text-sm font-bold border-b pb-2 mb-3">📅 新規予約</h2>
          <form onsubmit="handleBooking(event)">
            <div class="mb-3">
              <label class="block text-xs font-bold mb-1">備品</label>
              <select id="equipSelect" onchange="updateEquipInfo()" class="w-full border rounded p-1.5 text-sm"></select>
              <div class="mt-2 text-xs bg-gray-50 p-2 rounded text-gray-600">
                <div>設置場所: <span id="infoLocation">-</span></div>
                <div>必要講習: <span id="infoTraining" class="font-bold text-emerald-700">-</span></div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-3">
              <div>
                <label class="block text-xs font-bold mb-1">開始</label>
                <input type="datetime-local" id="startTime" required class="w-full border rounded p-1 text-xs">
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">終了</label>
                <input type="datetime-local" id="endTime" required class="w-full border rounded p-1 text-xs">
              </div>
            </div>
            <div class="mb-4">
              <label class="block text-xs font-bold mb-1">利用目的</label>
              <textarea id="purpose" rows="2" required class="w-full border rounded p-1 text-xs" placeholder="例: 実験のため"></textarea>
            </div>
            <button type="submit" class="w-full bg-emerald-700 text-white py-2 rounded font-bold text-xs hover:bg-emerald-800">
              ✓ 予約する
            </button>
          </form>
        </div>

        <div class="bg-white p-4 rounded shadow">
          <h2 class="text-sm font-bold border-b pb-2 mb-3">📑 予約一覧</h2>
          <div id="logList" class="space-y-2 max-h-80 overflow-y-auto text-xs"></div>
        </div>
      </div>

      <!-- カレンダー -->
      <div class="col-span-8 bg-white p-4 rounded shadow">
        <div id="calendar"></div>
      </div>
    </div>
  </main>

  <script>
    // ★ Supabase & Google 設定情報
    const SUPABASE_URL = 'https://venzrdwpkfmijiqocaee.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OQhRrKbi37Sn3STe7rS2yQ_3uMkMYQn';
    const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
    const GOOGLE_API_KEY = 'YOUR_GOOGLE_API_KEY';
    const CALENDAR_ID = '85caa9b779f22c21536b5ca1c38adc01daf39508ad03fbb99e852cef98a671f4@group.calendar.google.com';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null, tokenClient = null, calendar = null;
    let equipments = [], logs = [], users = [];

    window.onload = () => {
      // GAPI 初期化
      gapi.load('client', async () => {
        await gapi.client.init({ apiKey: GOOGLE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'] });
      });
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/userinfo.email',
        callback: async (resp) => {
          if (resp.error) return;
          const res = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', { headers: { Authorization: `Bearer ${resp.access_token}` } });
          const userGoogle = await res.json();
          await checkUserRegistration(userGoogle.email);
        }
      });
      initCalendar();
    };

    function handleGoogleAuth() { tokenClient.requestAccessToken({ prompt: 'consent' }); }

    async function checkUserRegistration(email) {
      const { data } = await db.from('users').select('*').eq('email', email).single();
      document.getElementById('authModal').classList.add('hidden');
      
      if (data) {
        currentUser = data;
        startApp();
      } else {
        currentUser = { email: email, role: 'USERS', trainings: '' };
        document.getElementById('registerModal').classList.remove('hidden');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      currentUser.name = document.getElementById('regName').value;
      currentUser.dept = document.getElementById('regDept').value;
      
      await db.from('users').insert([currentUser]);
      document.getElementById('registerModal').classList.add('hidden');
      startApp();
    }

    async function startApp() {
      document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('userInfo').innerText = `${currentUser.name} (${currentUser.dept}) / ${currentUser.role}`;
      await refreshData();
    }

    async function refreshData() {
      const [eqRes, logRes, userRes] = await Promise.all([
        db.from('equipments').select('*'),
        db.from('logs').select('*'),
        db.from('users').select('*')
      ]);

      equipments = eqRes.data || [];
      logs = logRes.data || [];
      users = userRes.data || [];

      renderUI();
    }

    function initCalendar() {
      calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'timeGridWeek',
        locale: 'ja',
        slotMinTime: '08:00:00',
        slotMaxTime: '20:00:00'
      });
      calendar.render();
    }

    function renderUI() {
      document.getElementById('statEquip').innerText = equipments.length;
      document.getElementById('statDisabled').innerText = equipments.filter(e => e.status === '利用不可').length;
      document.getElementById('statBookings').innerText = logs.length;
      document.getElementById('statUsers').innerText = users.length;

      const select = document.getElementById('equipSelect');
      select.innerHTML = equipments.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
      updateEquipInfo();

      // カレンダー描画
      calendar.removeAllEvents();
      calendar.addEventSource(logs.map(l => ({
        id: l.id,
        title: `${l.equip_name} (${l.user_email})`,
        start: l.start_time,
        end: l.end_time,
        backgroundColor: l.user_email === currentUser.email ? '#047857' : '#4b5563'
      })));

      // リスト描画
      const logList = document.getElementById('logList');
      logList.innerHTML = logs.map(l => {
        const canDelete = l.user_email === currentUser.email || currentUser.role === 'ADMIN';
        return `
          <div class="p-2 border rounded bg-gray-50 flex justify-between items-center">
            <div>
              <div class="font-bold">${l.equip_name}</div>
              <div class="text-gray-500">${l.start_time.substring(0,16)} ～ ${l.end_time.substring(0,16)}</div>
              <div class="text-gray-400">${l.purpose} (${l.user_email})</div>
            </div>
            ${canDelete ? `<button onclick="cancelBooking('${l.id}', '${l.calendar_event_id}')" class="text-red-600 border px-2 py-0.5 rounded">削除</button>` : ''}
          </div>
        `;
      }).join('');
    }

    function updateEquipInfo() {
      const equip = equipments.find(e => e.id === document.getElementById('equipSelect').value);
      if (equip) {
        document.getElementById('infoLocation').innerText = equip.location || '未設定';
        document.getElementById('infoTraining').innerText = equip.required_training || 'なし';
      }
    }

    async function handleBooking(e) {
      e.preventDefault();
      const equip = equipments.find(e => e.id === document.getElementById('equipSelect').value);
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const purpose = document.getElementById('purpose').value;

      // 講習判定 (USERSのみチェック)
      if (currentUser.role !== 'ADMIN' && equip.required_training && equip.required_training !== 'なし') {
        const myTrainings = currentUser.trainings ? currentUser.trainings.split(',') : [];
        if (!myTrainings.includes(equip.required_training)) {
          alert(`【予約エラー】「${equip.required_training}」の受講が必要です。`);
          return;
        }
      }

      // 1. Google カレンダーへ連携
      const calEvent = await gapi.client.calendar.events.insert({
        calendarId: CALENDAR_ID,
        resource: {
          summary: `【予約】${equip.name} (${currentUser.name})`,
          description: `目的: ${purpose}\n予約者: ${currentUser.email}`,
          start: { dateTime: new Date(start).toISOString() },
          end: { dateTime: new Date(end).toISOString() }
        }
      });

      // 2. Supabase DBへ保存（爆速）
      const bookingId = 'BK_' + Date.now();
      await db.from('logs').insert([{
        id: bookingId,
        equip_id: equip.id,
        equip_name: equip.name,
        user_email: currentUser.email,
        start_time: start,
        end_time: end,
        purpose: purpose,
        history: `作成: ${new Date().toISOString()} (${currentUser.email})`,
        calendar_event_id: calEvent.result.id
      }]);

      alert('予約が完了しました');
      await refreshData();
    }

    async function cancelBooking(id, calEventId) {
      if (!confirm('予約を取り消しますか？')) return;

      if (calEventId) {
        try { await gapi.client.calendar.events.delete({ calendarId: CALENDAR_ID, eventId: calEventId }); }
        catch(err) { console.warn('Calendar delete error:', err); }
      }

      await db.from('logs').delete().eq('id', id);
      await refreshData();
    }
  </script>
</body>
</html>
